{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Search Results</h2>
<div class="row">
  {% for movie in movies %}
  <div class="col-md-3 col-sm-6 mb-4">
    <div class="card h-100 shadow-sm">
      <img src="{{ movie.poster_url }}" class="card-img-top" alt="{{ movie.title }}">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ movie.title }}</h5>
        <p class="card-text">⭐ {{ movie.rating }}/10</p>
        <p class="card-text text-muted">{{ movie.description|truncatewords:20 }}</p>
        <form method="post" action="/favorites/add/" class="mt-auto">
          {% csrf_token %}
          <input type="hidden" name="movie_id" value="{{ movie.id }}">
          <button class="btn btn-primary w-100">Add to Favorites</button>
        </form>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
