{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">My Favorites</h2>
<table class="table table-striped table-bordered">
  <thead class="table-dark">
    <tr>
      <th>Poster</th>
      <th>Title</th>
      <th>Rating</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for fav in favorites %}
    <tr>
      <td><img src="{{ fav.poster_url }}" alt="{{ fav.title }}" width="60"></td>
      <td>{{ fav.title }}</td>
      <td>⭐ {{ fav.rating }}</td>
      <td>{{ fav.description|truncatewords:15 }}</td>
      <td>
        <form method="post" action="/favorites/remove/{{ fav.id }}/">
          {% csrf_token %}
          <button class="btn btn-danger btn-sm">Remove</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="5" class="text-center">No favorites yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
